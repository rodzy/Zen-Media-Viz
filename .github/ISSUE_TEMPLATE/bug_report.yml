name: Bug report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open music.youtube.com
        2. Play a song
        3. ...
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Site playing the media
      placeholder: music.youtube.com
  - type: input
    id: zen-version
    attributes:
      label: Zen Browser version
      description: Found in Help > About Zen.
    validations:
      required: true
  - type: input
    id: sine-version
    attributes:
      label: Sine version
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Zen Media Viz version
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Browser Console output
      description: |
        Open the Browser Console (Cmd/Ctrl+Shift+J) and paste any lines containing `[zen-media-viz]`.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: A screenshot of the media player helps a lot.
